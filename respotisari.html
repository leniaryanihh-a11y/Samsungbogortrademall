<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samsung Store BTM | Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fa;color:#172033}
header{background:#1428a0;color:white;padding:24px 5%}
header h1{margin:0;font-size:23px}
header p{margin:8px 0 0;color:#dce2ff;font-size:13px}
main{max-width:1450px;margin:auto;padding:22px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select,button{padding:11px 13px;border:1px solid #e1e5ee;border-radius:8px;background:white;font-size:13px}
button{cursor:pointer;font-weight:bold}
.btn{background:#1428a0;color:white;border:0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card,.panel{background:white;border:1px solid #e8ebf2;border-radius:13px;padding:19px}
.card small{color:#778096}
.card h2{margin:12px 0 0;font-size:23px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:18px}
.panel h3{margin:0 0 17px;font-size:16px}
.chart{height:270px;position:relative}
.table-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.table-wrap{overflow:auto;max-height:600px}
table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}
th,td{padding:13px;border-bottom:1px solid #edf0f5;text-align:left}
th{background:#f5f6fa;position:sticky;top:0}
tr:hover td{background:#f8faff}
.status{font-size:12px;color:#69758b;margin:12px 0}
.empty{text-align:center;padding:35px;color:#8791a4}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:480px){main{padding:12px}.card{padding:13px}.card h2{font-size:19px}header h1{font-size:19px}}
</style>
</head>
<body>

<header>
<h1>SAMSUNG STORE BTM</h1>
<p>RETAIL SALES & PERFORMANCE DASHBOARD</p>
</header>

<main>

<div class="toolbar">
<select id="sheet">
<option value="Sheet1">Sheet1</option>
</select>
<input type="date" id="dateFilter">
<input id="search" placeholder="Cari sales / produk / data...">
<button class="btn" onclick="loadData()">REFRESH DATA</button>
</div>

<div class="cards">
<div class="card"><small>TOTAL TRANSAKSI</small><h2 id="transactions">0</h2></div>
<div class="card"><small>TOTAL UNIT</small><h2 id="units">0</h2></div>
<div class="card"><small>TOTAL OMZET</small><h2 id="revenue">Rp0</h2></div>
<div class="card"><small>JUMLAH KOLOM</small><h2 id="columns">0</h2></div>
</div>

<div class="grid">
<div class="panel">
<h3>Grafik Penjualan</h3>
<div class="chart"><canvas id="salesChart"></canvas></div>
</div>
<div class="panel">
<h3>Komposisi Penjualan</h3>
<div class="chart"><canvas id="categoryChart"></canvas></div>
</div>
</div>

<div class="panel">
<div class="table-head">
<h3 style="margin:0">DATABASE PENJUALAN</h3>
<span id="lastUpdate" class="status">Menunggu data...</span>
</div>
<div class="table-wrap">
<table>
<thead id="thead"></thead>
<tbody id="tbody">
<tr><td class="empty">Memuat spreadsheet...</td></tr>
</tbody>
</table>
</div>
<p class="status" id="info"></p>
</div>

</main>

<script>
const SPREADSHEET_ID="1qfJF8KHsCnz1hf6iZeyzIDupc-BuNq91JM8dX4PYaxo";

/*
  Publikasikan spreadsheet melalui:
  File > Share > Publish to web
  Pilih sheet yang ingin ditampilkan.
*/

const CSV_URL =
`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

let headers=[];
let allRows=[];
let salesChart=null;
let categoryChart=null;

function parseCSV(text){
 const result=[];
 let row=[],field="",quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c==='"'){
   if(quoted && text[i+1]==='"'){field+='"';i++}
   else quoted=!quoted;
  }else if(c===',' && !quoted){
   row.push(field);field="";
  }else if((c==='\n'||c==='\r')&&!quoted){
   if(c==='\r'&&text[i+1]==='\n')i++;
   row.push(field);
   if(row.some(v=>v!==""))result.push(row);
   row=[];field="";
  }else field+=c;
 }
 row.push(field);
 if(row.some(v=>v!==""))result.push(row);
 return result;
}

async function loadData(){
 document.getElementById("lastUpdate").textContent="Mengambil data...";
 try{
  const response=await fetch(CSV_URL+"&_="+Date.now());
  if(!response.ok)throw new Error("Gagal membaca spreadsheet");
  const csv=await response.text();
  const data=parseCSV(csv);
  if(!data.length)throw new Error("Spreadsheet kosong atau belum dipublikasikan");

  headers=data[0].map(v=>v.trim());
  allRows=data.slice(1).map((values,index)=>({
   id:index,
   values:headers.map((_,i)=>values[i]||"")
  }));

  updateDashboard();
  renderTable();
  document.getElementById("lastUpdate").textContent=
   "Terakhir diperbarui: "+new Date().toLocaleTimeString("id-ID");
 }catch(error){
  document.getElementById("lastUpdate").textContent="Koneksi gagal";
  document.getElementById("tbody").innerHTML=
   `<tr><td class="empty">${escapeHTML(error.message)}. Pastikan spreadsheet sudah dipublikasikan.</td></tr>`;
 }
}

function findCol(words){
 return headers.findIndex(h=>
  words.some(w=>h.toLowerCase().includes(w))
 );
}

function numeric(value){
 let s=String(value||"").trim();
 s=s.replace(/[^\d,.-]/g,"");
 if(s.includes(",")&&s.includes(".")){
  s=s.replace(/\./g,"").replace(",",".");
 }else if(s.includes(",")&&!s.includes(".")){
  s=s.replace(",",".");
 }else if(s.includes(".")){
  s=s.replace(/\./g,"");
 }
 return Number(s)||0;
}

function updateDashboard(){
 const valueCol=findCol(["value","nominal","omzet","revenue","harga","sales"]);
 const qtyCol=findCol(["qty","quantity","unit","jumlah"]);
 const filtered=getFiltered();

 let totalValue=0,totalQty=0;
 filtered.forEach(r=>{
  if(valueCol>=0)totalValue+=numeric(r.values[valueCol]);
  if(qtyCol>=0)totalQty+=numeric(r.values[qtyCol]);
 });

 document.getElementById("transactions").textContent=filtered.length.toLocaleString("id-ID");
 document.getElementById("units").textContent=qtyCol>=0?totalQty.toLocaleString("id-ID"):"—";
 document.getElementById("revenue").textContent=valueCol>=0?
  totalValue.toLocaleString("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}):"—";
 document.getElementById("columns").textContent=headers.length;
 drawCharts(filtered,valueCol,qtyCol);
}

function getFiltered(){
 const search=document.getElementById("search").value.toLowerCase();
 const date=document.getElementById("dateFilter").value;

 return allRows.filter(r=>{
  const matchSearch=r.values.join(" ").toLowerCase().includes(search);
  let matchDate=true;
  if(date){
   const dateCol=findCol(["tanggal","date"]);
   if(dateCol>=0){
    const raw=r.values[dateCol];
    const parsed=new Date(raw);
    const formatted=!isNaN(parsed)?
     `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,"0")}-${String(parsed.getDate()).padStart(2,"0")}`:"";
    matchDate=formatted===date || raw.includes(date);
   }else matchDate=false;
  }
  return matchSearch&&matchDate;
 });
}

function drawCharts(rows,valueCol,qtyCol){
 const dateCol=findCol(["tanggal","date"]);
 const catCol=findCol(["kategori","type","product","produk","model"]);

 const byDate={},byCategory={};
 rows.forEach(r=>{
  const date=dateCol>=0?(r.values[dateCol]||"Tidak diketahui"):"Data";
  const cat=catCol>=0?(r.values[catCol]||"Lainnya"):"Produk";
  const value=valueCol>=0?numeric(r.values[valueCol]):1;
  byDate[date]=(byDate[date]||0)+value;
  byCategory[cat]=(byCategory[cat]||0)+(qtyCol>=0?numeric(r.values[qtyCol]):1);
 });

 if(salesChart)salesChart.destroy();
 if(categoryChart)categoryChart.destroy();

 salesChart=new Chart(document.getElementById("salesChart"),{
  type:"bar",
  data:{
   labels:Object.keys(byDate).slice(-12),
   datasets:[{
    label:"Penjualan",
    data:Object.values(byDate).slice(-12),
    backgroundColor:"#1428a0",
    borderRadius:5
   }]
  },
  options:{
   responsive:true,maintainAspectRatio:false,
   plugins:{legend:{display:false}},
   scales:{y:{beginAtZero:true}}
  }
 });

 categoryChart=new Chart(document.getElementById("categoryChart"),{
  type:"doughnut",
  data:{
   labels:Object.keys(byCategory),
   datasets:[{
    data:Object.values(byCategory),
    backgroundColor:["#1428a0","#4285f4","#17a589","#f4b942","#e45b69","#9b59b6","#34495e"]
   }]
  },
  options:{responsive:true,maintainAspectRatio:false}
 });
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function renderTable(){
 const filtered=getFiltered();
 document.getElementById("thead").innerHTML=
  "<tr>"+headers.map(h=>`<th>${escapeHTML(h)}</th>`).join("")+"</tr>";

 document.getElementById("tbody").innerHTML=filtered.length?
  filtered.map(r=>"<tr>"+r.values.map(v=>`<td>${escapeHTML(v)}</td>`).join("")+"</tr>").join(""):
  `<tr><td colspan="${headers.length||1}" class="empty">Data tidak ditemukan</td></tr>`;

 document.getElementById("info").textContent=
  `Menampilkan ${filtered.length} dari ${allRows.length} data`;
}

document.getElementById("search").addEventListener("input",()=>{
 updateDashboard();renderTable();
});
document.getElementById("dateFilter").addEventListener("change",()=>{
 updateDashboard();renderTable();
});

loadData();
setInterval(loadData,15000);
</script>
</body>
</html>
